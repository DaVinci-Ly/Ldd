<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ديوان البيانات الليبي</title>
  <meta name="description" content="ديوان البيانات الليبي لتقنية المعلومات والاتصالات.">
  <meta name="copyright" content="© Ben Zahia Holding — ديوان البيانات الليبي. جميع الحقوق محفوظة.">
  <meta name="theme-color" content="#07252B">
  <link rel="canonical" href="https://www.ldd.ly/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_LY">
  <meta property="og:site_name" content="ديوان البيانات الليبي">
  <meta property="og:title" content="ديوان البيانات الليبي">
  <meta property="og:description" content="لتقنية المعلومات والاتصالات">
  <meta property="og:url" content="https://www.ldd.ly/">
  <meta property="og:image" content="https://www.ldd.ly/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.ldd.ly/og-image.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #07252B;
      --ink-2: #0B2F36;
      --paper: #ECF0EE;
      --dim: rgba(236, 240, 238, 0.58);
      --line: rgba(236, 240, 238, 0.16);
      --key: #34C7A9;
      --gutter: clamp(20px, 4.5vw, 64px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr auto auto auto;
      padding: 0 var(--gutter);
    }

    /* The brand arch stands on the rule under the name, like a doorway */
    .arch {
      position: absolute;
      inset-inline-end: 0;
      bottom: 0;
      height: 86%;
      width: auto;
      max-width: 46%;
      pointer-events: none;
    }

    .arch .body { fill: var(--ink-2); }
    .arch .stone { fill: var(--key); }

    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .top .mark { display: flex; align-items: center; gap: 12px; font-weight: 500; }
    .top .mark svg { width: 26px; height: 26px; }
    .top .latin { direction: ltr; color: var(--dim); letter-spacing: 0.04em; }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14vh 0 44px;
    }

    .hero h1 {
      position: relative;
      font-size: clamp(50px, 9.2vw, 136px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.01em;
    }

    .hero h1 span { display: block; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 32px;
      padding: 20px 0 9vh;
      border-top: 1px solid var(--line);
      font-size: clamp(17px, 1.6vw, 21px);
      font-weight: 300;
    }

    .meta .note { color: var(--dim); }
    .meta .note b { color: var(--key); font-weight: 500; }

    .works { padding-bottom: 40px; }

    .works h2 {
      font-size: 13px;
      font-weight: 500;
      color: var(--dim);
      margin-bottom: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 56px 1fr 1fr auto;
      align-items: baseline;
      gap: 24px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      transition: color 0.2s;
    }

    .row .n { direction: ltr; text-align: end; color: var(--dim); font-size: 14px; }
    .row .name { font-size: clamp(18px, 1.8vw, 24px); font-weight: 500; }
    .row .desc { color: var(--dim); font-size: 15px; }
    .row .url { direction: ltr; font-size: 14px; color: var(--dim); transition: color 0.2s; }
    .row:hover .name, .row:hover .url { color: var(--key); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0 calc(22px + env(safe-area-inset-bottom));
      font-size: 13px;
      color: var(--dim);
    }

    @media (max-width: 720px) {
      .arch { max-width: 62%; height: 78%; }
      .hero { padding-top: 64vw; }
      .meta { padding-bottom: 48px; }
      .row { grid-template-columns: 1fr auto; gap: 4px 16px; }
      .row .n, .row .desc { display: none; }
      .row .url { grid-column: 1 / -1; }
      footer { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="mark">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path fill="#ECF0EE" d="M15,105 L15,64 A45,45 0 0 1 105,64 L105,105 L88,105 L88,64 A28,28 0 0 0 32,64 L32,105 Z"/>
          <path fill="#34C7A9" d="M54.2,36.6 L50.6,20 A45,45 0 0 1 69.4,20 L65.8,36.6 Z"/>
        </svg>
        ldd.ly
      </div>
      <span class="latin">Libyan Data Diwan</span>
    </header>

    <section class="hero">
      <svg class="arch" viewBox="15 20 90 85" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
        <path class="body" d="M15,105 L15,64 A45,45 0 0 1 105,64 L105,105 L88,105 L88,64 A28,28 0 0 0 32,64 L32,105 Z"/>
        <path class="stone" d="M54.2,36.6 L50.6,20 A45,45 0 0 1 69.4,20 L65.8,36.6 Z"/>
      </svg>
      <h1><span>ديوان البيانات</span><span>الليبي</span></h1>
    </section>

    <div class="meta">
      <span>لتقنية المعلومات والاتصالات</span>
      <span class="note"><b>الموقع قيد الإنشاء.</b> نعود قريباً.</span>
    </div>

    <section class="works" aria-labelledby="works-title">
      <h2 id="works-title">من أعمالنا</h2>
      <a class="row" href="https://libyatenders.yosef.ly" target="_blank" rel="noopener">
        <span class="n">01</span>
        <span class="name">متتبع العطاءات الحكومية</span>
        <span class="desc">العطاءات الحكومية المفتوحة في مكان واحد</span>
        <span class="url">libyatenders.yosef.ly ↗</span>
      </a>
    </section>

    <footer>
      <span>© <span id="year">2026</span> ديوان البيانات الليبي</span>
      <span>جميع الحقوق محفوظة</span>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
