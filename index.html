<!doctype html>
<html lang="ar" dir="rtl">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply a saved night preference before first paint (the default is day).
    try { if (localStorage.getItem("theme") === "night") document.documentElement.dataset.theme = "night"; } catch (e) {}
  </script>
</head>
<body>
  <div class="backdrop">
    <picture class="scene scene-day">
      <source media="(orientation: portrait)" type="image/webp"
              srcset="/scene-tall-720.webp 720w, /scene-tall-1080.webp 1080w, /scene-tall-1350.webp 1350w" sizes="100vw">
      <img src="/scene-wide-1920.webp" srcset="/scene-wide-1280.webp 1280w, /scene-wide-1920.webp 1920w, /scene-wide-2400.webp 2400w"
           sizes="100vw" width="2400" height="1350" loading="lazy" fetchpriority="high"
           alt="قوس شعار ديوان البيانات الليبي على منصة، يغطيه ستار شفاف بلون النعناع يتسرّب منه ضوء حجر المفتاح، بين كثبان رملية في ضوء النهار">
    </picture>
    <picture class="scene scene-night">
      <source media="(orientation: portrait)" type="image/webp"
              srcset="/scene-night-tall-720.webp 720w, /scene-night-tall-1080.webp 1080w, /scene-night-tall-1350.webp 1350w" sizes="100vw">
      <img src="/scene-night-wide-1920.webp" srcset="/scene-night-wide-1280.webp 1280w, /scene-night-wide-1920.webp 1920w, /scene-night-wide-2400.webp 2400w"
           sizes="100vw" width="2400" height="1350" loading="lazy" fetchpriority="high"
           alt="المشهد نفسه ليلاً: القوس تحت الستار يضيئه حجر المفتاح من الداخل، تحت سماء مرصّعة بالنجوم">
    </picture>
  </div>

  <header class="site-header">
    <div class="wrap">
      <nav class="nav glass" aria-label="الموقع">
        <a class="brand" href="/" aria-label="ديوان البيانات الليبي، الصفحة الرئيسية">
          <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true">
            <path class="arch" d="M15,105 L15,64 A45,45 0 0 1 105,64 L105,105 L88,105 L88,64 A28,28 0 0 0 32,64 L32,105 Z"/>
            <path class="keystone" d="M54.2,36.6 L50.6,20 A45,45 0 0 1 69.4,20 L65.8,36.6 Z"/>
          </svg>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-name">
            <strong>ديوان البيانات الليبي</strong>
            <span class="latin" lang="en" dir="ltr">Libyan Data Diwan</span>
          </span>
        </a>
        <span class="brand-divider" aria-hidden="true"></span>
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="الوضع الليلي">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8Z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="reveal">
    <p class="chip">قيد الإنشاء</p>
    <h1 class="reveal-title">نُزيح الستار قريباً</h1>
    <p class="reveal-caption">الموقع الجديد لديوان البيانات الليبي</p>
  </main>

  <footer class="site-footer">
    <p class="credit glass">&copy; <span id="year">2026</span> ديوان البيانات الليبي. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="/main.js" defer></script>

</html>
