<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — ديوان البيانات الليبي</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07252B">
  <!-- Absolute paths: GitHub Pages serves this page at whatever URL was missing -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #07252B;
      --ink-2: #0B2F36;
      --paper: #ECF0EE;
      --dim: rgba(236, 240, 238, 0.58);
      --line: rgba(236, 240, 238, 0.16);
      --key: #34C7A9;
      --gutter: clamp(20px, 4.5vw, 64px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr auto auto;
      padding: 0 var(--gutter);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .top .mark { display: flex; align-items: center; gap: 12px; font-weight: 500; }
    .top .mark svg { width: 26px; height: 26px; }
    .top .latin { direction: ltr; color: var(--dim); letter-spacing: 0.04em; }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14vh 0 44px;
    }

    /* The doorway without its keystone: the thing you were looking for isn't here */
    .arch {
      position: absolute;
      inset-inline-end: 0;
      bottom: 0;
      height: 86%;
      width: auto;
      max-width: 46%;
      pointer-events: none;
    }

    .arch .body { fill: var(--ink-2); }
    .arch .gap { fill: none; stroke: var(--key); stroke-width: 0.6; stroke-dasharray: 1.6 1.6; }

    .code { position: relative; direction: ltr; text-align: right; font-size: 15px; color: var(--key); letter-spacing: 0.1em; }

    h1 {
      position: relative;
      margin-top: 8px;
      font-size: clamp(44px, 7.4vw, 108px);
      font-weight: 700;
      line-height: 1.15;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 32px;
      padding: 20px 0 9vh;
      border-top: 1px solid var(--line);
      font-size: clamp(17px, 1.6vw, 21px);
      font-weight: 300;
      color: var(--dim);
    }

    .meta a { color: var(--paper); font-weight: 500; transition: color 0.2s; }
    .meta a:hover { color: var(--key); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0 calc(22px + env(safe-area-inset-bottom));
      font-size: 13px;
      color: var(--dim);
    }

    @media (max-width: 720px) {
      .arch { max-width: 62%; height: 78%; }
      .hero { padding-top: 64vw; }
      .meta { padding-bottom: 48px; }
      footer { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="mark" href="/">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path fill="#ECF0EE" d="M15,105 L15,64 A45,45 0 0 1 105,64 L105,105 L88,105 L88,64 A28,28 0 0 0 32,64 L32,105 Z"/>
          <path fill="#34C7A9" d="M54.2,36.6 L50.6,20 A45,45 0 0 1 69.4,20 L65.8,36.6 Z"/>
        </svg>
        ldd.ly
      </a>
      <span class="latin">Libyan Data Diwan</span>
    </header>

    <section class="hero">
      <svg class="arch" viewBox="15 20 90 85" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
        <path class="body" d="M15,105 L15,64 A45,45 0 0 1 105,64 L105,105 L88,105 L88,64 A28,28 0 0 0 32,64 L32,105 Z"/>
        <path class="gap" d="M54.2,36.6 L50.6,20 A45,45 0 0 1 69.4,20 L65.8,36.6 Z"/>
      </svg>
      <div class="code">404</div>
      <h1>هذه الصفحة<br>غير موجودة</h1>
    </section>

    <div class="meta">
      <span>الرابط الذي فتحته غير صحيح أو لم يعد متاحاً.</span>
      <a href="/">العودة إلى الصفحة الرئيسية ←</a>
    </div>

    <footer>
      <span>© <span id="year">2026</span> ديوان البيانات الليبي</span>
      <span>جميع الحقوق محفوظة</span>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
